name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: No localhost references
        run: bash scripts/check-no-localhost.sh

      - name: Build
        run: npm run build
        env:
          # Public NEXT_PUBLIC_* values (exposed client-side anyway; also in .env.example)
          NEXT_PUBLIC_SANITY_PROJECT_ID: 4pws3pyj
          NEXT_PUBLIC_SANITY_DATASET: production

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so gitleaks can resolve its push-event diff range
          # (<before>^..<head>). Default fetch-depth:1 breaks it with
          # "ambiguous argument ... unknown revision".
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
